<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LDL Application</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #ldl-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #canvas {
      display: block;
      border: 1px solid #444;
      /* Size is set by LDL at runtime via emscripten_set_canvas_element_size */
    }

    /* Hide the canvas while the WASM is loading */
    #canvas.ldl-loading {
      display: none;
    }

    #ldl-status {
      font-size: 12px;
      color: #888;
      min-height: 16px;
      text-align: center;
      width: 100%;
    }

    #ldl-progress-outer {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }

    #ldl-progress-inner {
      height: 100%;
      width: 0%;
      background: #5b9bd5;
      transition: width 0.15s ease;
    }

    #ldl-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #333;
      border-top-color: #5b9bd5;
      border-radius: 50%;
      animation: ldl-spin 0.8s linear infinite;
    }

    @keyframes ldl-spin {
      to { transform: rotate(360deg); }
    }

    .ldl-hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="ldl-wrapper">
    <!-- Loading indicator (shown before WASM initialises) -->
    <div id="ldl-spinner"></div>
    <div id="ldl-status">Downloading…</div>
    <div id="ldl-progress-outer">
      <div id="ldl-progress-inner"></div>
    </div>

    <!-- The WebGL canvas.  LDL always targets "#canvas" -->
    <canvas id="canvas" class="ldl-loading"
            oncontextmenu="return false;"
            tabindex="0">
    </canvas>
  </div>

  <script type="text/javascript">
    // Emscripten module overrides
    var Module = {

      // Called with 0-1 as WASM loads
      setStatus: function(text) {
        var el = document.getElementById('ldl-status');
        if (el) el.textContent = text || '';
      },

      // Called with (done, total) while the .wasm downloads
      monitorRunDependencies: function(left) {
        // left == 0 means all dependencies are ready
      },

      // Called once the WASM module is compiled and ready to run
      onRuntimeInitialized: function() {
        var spinner  = document.getElementById('ldl-spinner');
        var status   = document.getElementById('ldl-status');
        var progress = document.getElementById('ldl-progress-outer');
        var canvas   = document.getElementById('canvas');

        if (spinner)  spinner.classList.add('ldl-hidden');
        if (status)   status.classList.add('ldl-hidden');
        if (progress) progress.classList.add('ldl-hidden');

        if (canvas) {
          canvas.classList.remove('ldl-loading');
          // Give the canvas focus so keyboard events reach LDL immediately
          canvas.focus();
        }
      },

      // Download progress for the .wasm file
      downloadProgress: function(e) {
        if (e.lengthComputable) {
          var bar = document.getElementById('ldl-progress-inner');
          if (bar) bar.style.width = (e.loaded / e.total * 100).toFixed(1) + '%';
        }
      },

      // Catch fatal errors and show them in the status bar
      onAbort: function(what) {
        var el = document.getElementById('ldl-status');
        if (el) el.textContent = 'Fatal error: ' + what;
        var spinner = document.getElementById('ldl-spinner');
        if (spinner) spinner.classList.add('ldl-hidden');
      },

      // Print / printErr go to the browser console
      print: function(text) {
        if (arguments.length > 1)
          text = Array.prototype.slice.call(arguments).join(' ');
        console.log(text);
      },

      printErr: function(text) {
        if (arguments.length > 1)
          text = Array.prototype.slice.call(arguments).join(' ');
        console.error(text);
      },

      canvas: (function() {
        var canvas = document.getElementById('canvas');

        // Prevent the right-click context menu on the canvas
        canvas.addEventListener('contextmenu', function(e) {
          e.preventDefault();
        }, false);

        return canvas;
      })(),

      // Prevent the browser from showing its own fullscreen warning
      // when an LDL app calls into Emscripten fullscreen APIs
      requestFullscreen: function(lockPointer, resizeCanvas) {
        var canvas = document.getElementById('canvas');
        if (canvas.requestFullscreen) {
          canvas.requestFullscreen();
        } else if (canvas.webkitRequestFullscreen) {
          canvas.webkitRequestFullscreen();
        }
      }
    };

    // ---------------------------------------------------------------------------
    // Resize the canvas to fill the CSS area when the window is resized.
    // The C side receives an LDL_EventIsResize via emscripten_set_resize_callback.
    // ---------------------------------------------------------------------------
    window.addEventListener('resize', function() {
      // The Emscripten backend reads the CSS size itself; nothing extra needed here.
    }, false);

    // ---------------------------------------------------------------------------
    // Prevent the browser from consuming arrow keys / space / F-keys while
    // the canvas is focused (they would otherwise scroll the page, open menus, etc.)
    // ---------------------------------------------------------------------------
    window.addEventListener('keydown', function(e) {
      var prevent = [
        32,          // Space
        37, 38, 39, 40, // Arrow keys
        112,113,114,115,116,117,118,119,120,121,122,123 // F1-F12
      ];
      if (prevent.indexOf(e.keyCode) !== -1 &&
          document.activeElement === document.getElementById('canvas')) {
        e.preventDefault();
      }
    }, false);
  </script>

  <!--
    Emscripten injects the generated .js loader here.
    The {{{ SCRIPT }}} token is replaced by emcc at link time.
  -->
  {{{ SCRIPT }}}
</body>
</html>
